[platformio]
; `native` has no Arduino framework, so it can only build tests, not src/.
default_envs = devkit

[env:devkit]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.0
    thomasfredericks/Bounce2@^2.72

[env:native]
platform = native
test_framework = unity
